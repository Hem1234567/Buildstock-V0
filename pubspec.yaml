name: buildstock
description: "BuildStock — offline-first building materials business management and billing for Vijay Balaji Agency."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  connectivity_plus: ^7.3.2
  intl: ^0.20.2
  uuid: ^4.6.0
  mobile_scanner: ^7.5.0
  pdf: ^3.12.0
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  file_picker: ^13.3.2
  fl_chart: ^1.3.0
  excel: ^4.0.6
  flutter_local_notifications: ^22.3.3
  shared_preferences: ^2.5.5
  crypto: ^3.0.8
  share_plus: ^13.3.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.10.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/HindMadurai-Regular.ttf
        - asset: assets/fonts/HindMadurai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindMadurai-Bold.ttf
          weight: 700
    - family: Tamil
      fonts:
        - asset: assets/fonts/HindMadurai-Regular.ttf
        - asset: assets/fonts/HindMadurai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindMadurai-Bold.ttf
          weight: 700
