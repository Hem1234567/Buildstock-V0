org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# Disable Gradle daemon on CI for clean, reproducible builds
org.gradle.daemon=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.daemon.jvmargs=-Xmx2G
# Ensure native libraries are properly extracted in release builds
android.bundle.enableUncompressedNativeLibs=false
# Enable native assets support (required by jni / path_provider_android)
flutter.enableNativeAssets=true
