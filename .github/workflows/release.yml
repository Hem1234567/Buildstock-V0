name: Release

# Publishes a GitHub release with the APK when a `v*` tag is pushed, or when
# run manually with a version tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"

jobs:
  release:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; Gradle will download SDK components itself."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json written."

      - name: Write stub google-services.json (no secret)
        if: ${{ secrets.GOOGLE_SERVICES_JSON == '' }}
        shell: bash
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "800582767727",
              "project_id": "inventory-management-be3d1",
              "storage_bucket": "inventory-management-be3d1.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:800582767727:android:000000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.vijaybalaji.buildstock"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCaKEwCnlUYS9K1j-PgFYVrDUU69MLCIV4"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          echo "Stub google-services.json written."

      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release-keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release-keystore.jks"
            } > android/key.properties
          else
            echo "No signing secrets configured; Gradle will use debug signing."
          fi

      - name: Build release APK
        run: >
          flutter build apk --release --no-tree-shake-icons
          --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: BuildStock ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
