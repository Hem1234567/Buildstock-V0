name: Release

# Publishes a GitHub release with the APK when a `v*` tag is pushed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "17"
  NDK_VERSION: "27.3.13750724"

jobs:
  release:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install CMake and prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; Gradle will download SDK components itself."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "cmake;3.22.1" > /dev/null 2>&1 || \
          "$SDKMANAGER" "cmake;3.18.1" > /dev/null 2>&1 || \
          echo "::warning::CMake install failed — will use system cmake."
          if [ ! -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            "$SDKMANAGER" "ndk;$NDK_VERSION" > /dev/null 2>&1 || \
              echo "::warning::NDK $NDK_VERSION not installed."
          fi
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written from secret."
          fi

      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release-keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release-keystore.jks"
            } > android/key.properties
          else
            echo "No signing secrets configured; Gradle will use debug signing."
          fi

      - name: Build release APK
        shell: bash
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }} \
            > /tmp/release_build.log 2>&1
          BUILD_EXIT=$?
          cat /tmp/release_build.log
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "===== BUILD FAILED ====="
            tail -300 /tmp/release_build.log
            exit $BUILD_EXIT
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: BuildStock ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
