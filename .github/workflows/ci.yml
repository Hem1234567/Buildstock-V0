name: Build Android APK

# Builds a release APK on every push, pull request and manual run.
# The APK is attached to the run as the `buildstock-apk` artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "17"
  # NDK r27c — pre-installed on ubuntu-latest; pinned here to avoid
  # Gradle downloading a different version at build time.
  NDK_VERSION: "27.3.13750724"

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ── Android SDK / NDK / CMake ──────────────────────────────────────────
      - name: Install CMake and accept SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"

          # Locate sdkmanager
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found — Gradle will manage SDK components itself."
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"

          # Accept licenses silently
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # Install CMake (required by the jni / path_provider_android packages)
          "$SDKMANAGER" "cmake;3.22.1" > /dev/null 2>&1 || \
          "$SDKMANAGER" "cmake;3.18.1" > /dev/null 2>&1 || \
          echo "::warning::CMake install via sdkmanager failed — will use system cmake if available."

          # Ensure the pre-installed NDK is recognised
          if [ -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION already present."
          else
            "$SDKMANAGER" "ndk;$NDK_VERSION" > /dev/null 2>&1 || \
              echo "::warning::NDK $NDK_VERSION not installed — Gradle will attempt to download it."
          fi

          # Expose NDK path for Gradle
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Show Android SDK environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo ""
          echo "=== Installed NDKs ==="
          ls "$SDK_ROOT/ndk/" 2>/dev/null || echo "none"
          echo ""
          echo "=== CMake versions ==="
          ls "$SDK_ROOT/cmake/" 2>/dev/null || echo "none"
          echo ""
          echo "=== Installed Platforms ==="
          ls "$SDK_ROOT/platforms/" 2>/dev/null || echo "none"
          echo ""
          echo "=== build-tools ==="
          ls "$SDK_ROOT/build-tools/" 2>/dev/null | tail -5 || echo "none"

      # ── Flutter ────────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # ── Firebase (optional) ────────────────────────────────────────────────
      # This app initialises Firebase manually via FirebaseOptions (firebase_runtime.dart),
      # so google-services.json and the google-services Gradle plugin are NOT required.
      # The GOOGLE_SERVICES_JSON secret is optional; builds without it still work.
      - name: Inject google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Wrote google-services.json from secret."
          else
            echo "No GOOGLE_SERVICES_JSON secret — skipping (not needed; app uses manual FirebaseOptions)."
          fi

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build release APK
        shell: bash
        run: |
          # Run flutter build, capturing all output to a log file.
          # We avoid set -o pipefail + tee to prevent false negatives.
          flutter build apk --release --no-tree-shake-icons --verbose \
            > /tmp/build_full.log 2>&1
          BUILD_EXIT=$?
          cat /tmp/build_full.log
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "===== BUILD FAILED (exit $BUILD_EXIT) — last 300 lines ====="
            tail -300 /tmp/build_full.log
            exit $BUILD_EXIT
          fi

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_full.log
          retention-days: 7

      - name: Name the APK
        id: apk
        shell: bash
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d+ -f1)"
          NAME="BuildStock-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/${NAME}"
          echo "apk_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=build/app/outputs/flutter-apk/${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buildstock-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

  # ── Code quality (non-blocking) ──────────────────────────────────────────
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        continue-on-error: true
        run: flutter test --reporter expanded
