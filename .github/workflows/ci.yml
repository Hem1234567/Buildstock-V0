name: Build Android APK

# Builds a release APK on every push, pull request and manual run.
# The APK is attached to the run as the `buildstock-apk` artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned Flutter version — matches .metadata and pubspec.yaml sdk constraint.
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; Gradle will download SDK components itself."
            exit 0
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" \
            || echo "::warning::sdkmanager install failed; Gradle will try to auto-download."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Inject google-services.json for Firebase Android SDK.
      # Store the file contents as a GitHub Secret named GOOGLE_SERVICES_JSON
      # (plain JSON text, not base64). If the secret is absent the step is
      # skipped and the app falls back to offline-only mode.
      - name: Inject google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"

      # If no secret is set, write a minimal stub so the google-services
      # Gradle plugin can parse the file without crashing the build.
      - name: Write stub google-services.json (no secret)
        if: ${{ secrets.GOOGLE_SERVICES_JSON == '' }}
        shell: bash
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "800582767727",
              "project_id": "inventory-management-be3d1",
              "storage_bucket": "inventory-management-be3d1.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:800582767727:android:000000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.vijaybalaji.buildstock"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCaKEwCnlUYS9K1j-PgFYVrDUU69MLCIV4"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          echo "Stub google-services.json written."

      # The Drift code (lib/core/database/app_database.g.dart) and the
      # localization code (lib/l10n/generated) are committed, so the build does
      # not depend on build_runner. Regenerate locally with:
      #   dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: >
          flutter build apk --release --no-tree-shake-icons
          --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }}

      - name: Name the APK
        id: apk
        shell: bash
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d+ -f1)"
          NAME="BuildStock-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=build/app/outputs/flutter-apk/${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buildstock-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # Quality checks run in their own job so that an analyzer note or a flaky
  # test can never prevent the APK from being produced.
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        continue-on-error: true
        run: flutter test --reporter expanded
